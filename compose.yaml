# Local development only. The credentials below are throwaway values.
# The PHP 5.6 version of the app lives at the tags legacy-original and
# last-php56; check one out and run `docker compose up` there to see it.
services:
  # The app on PHP 8.3. app/tmp is a volume, so cache files never land in
  # the working tree.
  php83:
    build: docker/php83
    ports:
      - "8083:80"
    volumes:
      - .:/var/www/html
      - ./docker/php83/database.php:/var/www/html/app/config/database.php:ro
      - php83-tmp:/var/www/html/app/tmp
    depends_on:
      - db
      - mailpit

  mailpit:
    image: axllent/mailpit:v1.33.0
    ports:
      - "8025:8025"

  db:
    image: mysql:5.5
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: croogo
      MYSQL_USER: croogo
      MYSQL_PASSWORD: croogo
    command: --character-set-server=utf8 --collation-server=utf8_unicode_ci
    volumes:
      # Same schema and sample data the web installer would load.
      - ./app/config/schema/sql/croogo.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./app/config/schema/sql/croogo_data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
      - db-data:/var/lib/mysql

  # Characterization tests: docker compose run --rm tests
  tests:
    build: docker/tests
    profiles: [tests]
    environment:
      CROOGO_URL: http://php83
      MAILPIT_URL: http://mailpit:8025
      DB_DSN: mysql:host=db;dbname=croogo;charset=utf8
      DB_USER: croogo
      DB_PASSWORD: croogo
    volumes:
      - ./tests/characterization:/tests
      - composer-cache:/root/.composer/cache
    depends_on:
      - php83
    command: vendor/bin/phpunit

  # Rector and PHPStan: docker compose run --rm quality vendor/bin/phpstan
  quality:
    build: docker/tests
    profiles: [tools]
    working_dir: /app/tools/quality
    volumes:
      - .:/app
      - composer-cache:/root/.composer/cache

volumes:
  db-data:
  composer-cache:
  php83-tmp:
