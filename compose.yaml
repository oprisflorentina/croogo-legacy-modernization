# Local development only. The credentials below are throwaway values.
# The PHP 5.6 version of the app lives at the tags legacy-original and
# last-php56; check one out and run `docker compose up` there to see it.
services:
  # The web server. nginx serves app/webroot's files itself and passes PHP
  # requests to php83 over FastCGI. It only gets app/webroot, read-only: the
  # rest of the code isn't reachable through it.
  web:
    image: nginx:1.30.5-alpine
    ports:
      - "8083:80"
    volumes:
      - ./app/webroot:/var/www/html/app/webroot:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      php83:
        condition: service_healthy

  # The app on PHP 8.3, as PHP-FPM. app/tmp is a volume, so cache files never
  # land in the working tree.
  php83:
    build: docker/php83
    # Healthy once PHP-FPM accepts connections, so nginx never starts first
    # and answers 502.
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 1s
    environment:
      # Debug output on: the characterization tests find PHP warnings in it.
      # Without CROOGO_DEBUG the app runs in production mode.
      CROOGO_DEBUG: "1"
      # The site's own secrets, instead of CakePHP's published ones.
      CROOGO_SECURITY_SALT: local-development-salt-not-for-production
      CROOGO_CIPHER_SEED: "4815162342"
      # The sample data's password hashes were made with CakePHP's published
      # salt. It stays usable for checking them until each user logs in once.
      CROOGO_LEGACY_SALT: DYhG93b0qyJfIxfs2guVoUubWwvniR2G0FgaC9mi19
    volumes:
      - .:/var/www/html
      - ./docker/php83/database.php:/var/www/html/app/config/database.php:ro
      - php83-tmp:/var/www/html/app/tmp
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  mailpit:
    image: axllent/mailpit:v1.33.0
    ports:
      - "8025:8025"

  db:
    image: mysql:5.5
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: croogo
      MYSQL_USER: croogo
      MYSQL_PASSWORD: croogo
    command: --character-set-server=utf8 --collation-server=utf8_unicode_ci
    volumes:
      # Same schema and sample data the web installer would load.
      - ./app/config/schema/sql/croogo.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./app/config/schema/sql/croogo_data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
      - db-data:/var/lib/mysql
    # On its first start, MySQL loads the files above into a temporary server
    # with networking off, then restarts. A ping over TCP only answers once
    # the data is in and the real server is up, so the app waits for that.
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 2s
      timeout: 5s
      retries: 60

  # Characterization tests: docker compose run --rm tests
  tests:
    build: docker/tests
    profiles: [tests]
    environment:
      CROOGO_URL: http://web
      CROOGO_RELAY_URL: http://relay
      MAILPIT_URL: http://mailpit:8025
      DB_DSN: mysql:host=db;dbname=croogo;charset=utf8
      DB_USER: croogo
      DB_PASSWORD: croogo
    volumes:
      - ./tests/characterization:/tests
      - composer-cache:/root/.composer/cache
    depends_on:
      - web
      - relay
    command: vendor/bin/phpunit

  # A second visitor for the tests: it passes TCP connections to the app
  # unchanged, so the app sees the relay's IP address instead of the tests
  # container's. No header is added. Used by the login lockout tests.
  relay:
    image: alpine/socat:1.8.1.1
    profiles: [tests]
    command: TCP-LISTEN:80,fork,reuseaddr TCP:web:80
    depends_on:
      - web

  # Rector and PHPStan: docker compose run --rm quality vendor/bin/phpstan
  quality:
    build: docker/tests
    profiles: [tools]
    working_dir: /app/tools/quality
    volumes:
      - .:/app
      - composer-cache:/root/.composer/cache

volumes:
  db-data:
  composer-cache:
  php83-tmp:
