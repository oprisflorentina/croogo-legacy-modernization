; PHP-FPM starts its workers with an empty environment by default
; (clear_env). The app reads its settings with getenv(): CROOGO_DEBUG and the
; secrets in app/config/core.php. So the workers keep the container's
; environment, as mod_php did. A variable that isn't set stays unset, which
; the production-mode checks in core.php rely on.
[www]
clear_env = no
