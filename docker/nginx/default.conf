# nginx in front of PHP-FPM (the php83 service). nginx doesn't read .htaccess
# files, so this repeats what they did under Apache:
#   - Only app/webroot is served. The root .htaccess rewrote every request
#     into it; here it is simply the document root.
#   - An address that isn't a file or a folder goes to index.php?url=...
#     (app/webroot/.htaccess): the friendly URLs, and Croogo's error page for
#     unknown addresses.
#   - Nothing in uploads/ runs, and script files there are refused
#     (app/webroot/uploads/.htaccess).
#   - .ht* files are refused, as Apache's default configuration does.
server {
    listen 80;
    server_name _;
    root /var/www/html/app/webroot;
    index index.php index.html;

    # PHP's default post_max_size is 8M. nginx's own default limit is 1M.
    client_max_body_size 8m;

    location / {
        try_files $uri $uri/ /index.php?url=$uri&$args;
    }

    # ^~ stops nginx from also trying the PHP location below for these paths,
    # so nothing in uploads/ is ever passed to PHP.
    location ^~ /uploads/ {
        location ~ \.(php[0-9]?|phtml|phar|pht|phps|cgi|pl|py|sh)$ {
            deny all;
        }
        location ~ /\.ht {
            deny all;
        }
        try_files $uri $uri/ /index.php?url=$uri&$args;
    }

    location ~ /\.ht {
        deny all;
    }

    location ~ \.php$ {
        # A .php address that isn't a file is an unknown address, as it was
        # under Apache.
        try_files $uri /index.php?url=$uri&$args;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # Apache passed the host name the browser asked for.
        fastcgi_param SERVER_NAME $host;
        fastcgi_pass php83:9000;
    }
}
