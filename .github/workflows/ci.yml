# Runs on every push and pull request. Both jobs use the same Docker Compose
# services as a local run, so CI checks exactly what a developer runs.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Characterization tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # On Linux the checkout belongs to the runner's user, and Apache runs as
      # www-data, so the attachment tests couldn't store their uploads.
      # Docker Desktop on Windows and macOS doesn't enforce this.
      - name: Let the web server write to uploads
        run: chmod -R a+w app/webroot/uploads

      - name: Start the app and wait for the database
        run: docker compose up -d --build --wait

      - name: Install the test dependencies
        run: docker compose run --rm tests composer install --no-interaction --no-progress

      # nginx sends /contact to the Symfony app, which needs its vendor/ too.
      - name: Install the Symfony app's dependencies
        run: docker compose run --rm --no-deps -w /app/symfony quality composer install --no-interaction --no-progress

      - name: Load every class on PHP 8.3
        run: docker compose exec -T php83 php tools/check-declarations.php

      # Every service gets what its constructor asks for, and the templates parse.
      - name: Check the Symfony app's container and templates
        run: |
          docker compose exec -T -u www-data symfony php bin/console lint:container
          docker compose exec -T -u www-data symfony php bin/console lint:twig templates

      - name: Run the characterization tests
        run: docker compose run --rm tests

      - name: Show the logs
        if: failure()
        run: docker compose logs web php83 symfony db

  static-analysis:
    name: PHPStan and Rector
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install PHPStan and Rector
        run: docker compose run --rm --no-deps quality composer install --no-interaction --no-progress

      - name: Analyse Croogo at level 5 against the baseline
        run: docker compose run --rm --no-deps quality vendor/bin/phpstan analyse --memory-limit=2G --no-progress

      # Fails if new or changed code misses a PHP 8.3 rule the rest follows.
      - name: Check that Rector has nothing left to change
        run: docker compose run --rm --no-deps quality vendor/bin/rector --dry-run

      # The Symfony app has its own PHPStan, in its composer.json. It runs in
      # the app's own container, with the app's environment, and reads the
      # compiled container that cache:warmup writes. No database is started.
      - name: Install the Symfony app's dependencies
        run: docker compose run --rm --no-deps -w /app/symfony quality composer install --no-interaction --no-progress

      - name: Start the Symfony app's container
        run: docker compose up -d --no-deps --wait symfony

      - name: Analyse the Symfony app at level max
        run: |
          docker compose exec -T -u www-data symfony php bin/console cache:warmup
          docker compose exec -T -u www-data symfony vendor/bin/phpstan analyse --memory-limit=1G --no-progress
